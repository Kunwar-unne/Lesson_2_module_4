<!DOCTYPE html>
<html>
    <head>
    </head>
    <body>
        <p>A function can access variables defined in the function:</p>
        <button type="button" onclick="myFunction()">Click me!</button>
        <p class="demo"></p>
        <p class="demo1"></p>
        <p class="demo2"></p>
        <script>
            var b = 5;

            function myFunction() {
                var a = 5;
                document.getElementById("demo").innerHTML = b * a;
            }
                document.getElementById("demo1").innerHTML = a;
                document.getElementById("demo2").innerHTML = b;
            
        </script>
    </body>
</html>
